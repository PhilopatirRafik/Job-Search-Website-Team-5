<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add New Job</title>
  </head>

  <body>
    <nav>
      <a href="../index.html">Home</a>

      <a href="admin_dashboard.html">Dashboard</a>

      <a href="add_job.html">Add Job</a>

      <a href="admin_jobs_list.html">Jobs List</a>

      <a href="login.html">Logout</a>
    </nav>

    <header>
      <h1>Add New Job</h1>
    </header>
    <form>
      <div>
        <label for="job-title">Job Title</label>
        <input id="job-title" type="text" name="job_title" required />
      </div>
      <div>
        <label for="salary">Salary</label>
        <input id="salary" type="number" name="salary" step="0.01" required />
      </div>
      <div>
        <label for="company">Company Name</label>
        <input id="company" type="text" name="company_name" required />
      </div>
      <div>
        <label for="status">Job Status</label>
        <select id="status" name="status" required>
          <option value="open">Open</option>
          <option value="closed">Closed</option>
        </select>
      </div>

      <div>
        <label for="years">Years of Experience</label>
        <input
          id="years"
          type="number"
          name="years_experience"
          step="1"
          min="0"
          required
        />
      </div>
      <div>
        <label for="description">Description</label>
        <textarea
          id="description"
          name="description"
          rows="5"
          required
        ></textarea>
      </div>

      <div>
        <button type="submit">Add Job</button>
      </div>
    </form>
  </body>
</html>
