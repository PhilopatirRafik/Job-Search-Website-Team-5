<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css">
    <title>Add New Job</title>
</head>
<body>
    <nav>
        <a href="../index.html">Home</a>
        <a href="admin_dashboard.html">Dashboard</a>
        <a href="add_job.html">Add Job</a>
        <a href="admin_jobs_list.html">Jobs List</a>
        <a href="login.html">Logout</a>
    </nav>

    <div class="admin-form-container">
        <header>
            <h1>Add New Job</h1>
        </header>

        <div class="success-message" id="successMessage">Job Added Successfully</div>

        <form id="addJobForm">
            <div>
                <label for="job-title">Job Title</label>
                <input id="job-title" type="text" name="job_title" required />
                <span class="error-message" id="titleError"></span>
            </div>

            <div>
                <label for="salary">Salary</label>
                <input id="salary" type="number" name="salary" step="0.01" required />
                <span class="error-message" id="salaryError"></span>
            </div>

            <div>
                <label for="company">Company Name</label>
                <input id="company" type="text" name="company_name" required />
                <span class="error-message" id="companyError"></span>
            </div>

            <div>
                <label for="status">Job Status</label>
                <select id="status" name="status" required>
                    <option value="open">Open</option>
                    <option value="closed">Closed</option>
                </select>
            </div>

            <div>
                <label for="years">Years of Experience</label>
                <input id="years" type="number" name="years_experience" step="1" min="0" required />
                <span class="error-message" id="yearsError"></span>
            </div>

            <div>
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="5" required></textarea>
                <span class="error-message" id="descriptionError"></span>
            </div>

            <div class="button-group">
                <button type="submit">Add Job</button>
                <button type="reset" class="btn-reset">Reset</button>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('addJobForm');
            const successMsg = document.getElementById('successMessage');

            function showError(inputId, errorId, message) {
                document.getElementById(errorId).textContent = message;
                document.getElementById(inputId).classList.add('error');
            }

            function clearErrors() {
                const errors = document.querySelectorAll('.error-message');
                errors.forEach(err => err.textContent = '');
                const inputs = document.querySelectorAll('.error');
                inputs.forEach(inp => inp.classList.remove('error'));
            }

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                clearErrors();

                const title = document.getElementById('job-title').value.trim();
                const salary = document.getElementById('salary').value;
                const company = document.getElementById('company').value.trim();
                const years = document.getElementById('years').value;
                const description = document.getElementById('description').value.trim();
                const status = document.getElementById('status').value;

                let isValid = true;

                if (title === '') {
                    showError('job-title', 'titleError', 'Job title is required');
                    isValid = false;
                } else if (title.length < 3) {
                    showError('job-title', 'titleError', 'Job title must be at least 3 characters');
                    isValid = false;
                }

                if (salary === '' || parseFloat(salary) <= 0) {
                    showError('salary', 'salaryError', 'Salary must be greater than 0');
                    isValid = false;
                }

                if (company === '') {
                    showError('company', 'companyError', 'Company name is required');
                    isValid = false;
                }

                if (years === '' || parseInt(years) < 0) {
                    showError('years', 'yearsError', 'Years of experience cannot be negative');
                    isValid = false;
                }

                if (description === '') {
                    showError('description', 'descriptionError', 'Description is required');
                    isValid = false;
                } else if (description.length < 10) {
                    showError('description', 'descriptionError', 'Description must be at least 10 characters');
                    isValid = false;
                }

                if (isValid) {
                    const newJob = {
                        id: 'job_' + Date.now(),
                        title: title,
                        salary: parseFloat(salary),
                        company: company,
                        status: status,
                        years: parseInt(years),
                        description: description,
                        dateAdded: new Date().toISOString()
                    };

                    let jobs = JSON.parse(localStorage.getItem('jobs') || '[]');
                    jobs.push(newJob);
                    localStorage.setItem('jobs', JSON.stringify(jobs));

                    successMsg.style.display = 'block';
                    form.reset();
                    clearErrors();

                    setTimeout(() => {
                        successMsg.style.display = 'none';
                    }, 3000);
                }
            });
        });
    </script>
</body>
</html>
