<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apply for Job</title>

    <!-- Main Style -->
    <link rel="stylesheet" href="../style.css">
    <!-- Page Custom Style -->
    <link rel="stylesheet" href="../apply.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav>
        <a href="../index.html">Home</a>
        <a href="search_jobs.html">Search Jobs</a>
        <a href="user_applied_jobs.html">Applied Jobs</a>
        <a href="login.html">Logout</a>
    </nav>

    <!-- FORM CONTAINER -->
    <div class="admin-form-container">

        <h1>Apply for Job</h1>

        <form id="applyForm">

            <div>
                <label>Select Job:</label>
                <select id="jobSelect" required>
                    <option value="">Choose a Job</option>
                </select>
            </div>

            <div>
                <label>Full Name:</label>
                <input type="text" id="fullname" placeholder="Enter your full name" required />
                <span class="error-message" id="nameError"></span>
            </div>

            <div>
                <label>Email:</label>
                <input type="email" id="email" placeholder="Enter your email" required />
                <span class="error-message" id="emailError"></span>
            </div>

            <div>
                <label>Phone Number:</label>
                <input type="tel" id="phone" placeholder="Enter your phone number" />
            </div>

            <div>
                <label>Years of Experience:</label>
                <input type="number" id="experience" placeholder="Enter years of experience" min="0" />
            </div>

            <div>
                <label>Upload CV Link:</label>
                <input type="url" id="cv" placeholder="Enter your CV link" />
            </div>

            <div>
                <label>Cover Letter:</label>
                <textarea id="cover_letter" rows="4" placeholder="Enter your cover letter"></textarea>
            </div>

            <div class="button-group">
                <button type="submit">Apply</button>
                <button type="reset" class="btn-reset">Reset</button>
            </div>

            <div class="success-message" id="successMsg">
                Application submitted successfully!
            </div>

        </form>

        <a href="search_jobs.html">← Back to Jobs</a>

    </div>

    <!-- JS -->
    <script src="../JS/apply.js"></script>

</body>
</html>
