<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apply for Job</title>
  </head>

  <body>
    <nav>
      <a href="../index.html">Home</a>

      <a href="search_jobs.html">Search Jobs</a>

      <a href="user_applied_jobs.html">Applied Jobs</a>

      <a href="login.html">Logout</a>
    </nav>

    <h1>Apply for Job</h1>

    <form action="user_applied_jobs.html">
      <label>Select Job:</label><br />

      <select name="job" placeholder="Select a job" required>
        <option value="">Choose a Job</option>

        <option>Frontend Developer - Google</option>

        <option>Backend Developer - Amazon</option>

        <option>UI Designer - Microsoft</option>

        <option>Data Analyst - Meta</option>
      </select>

      <br /><br />

      <label>Full Name:</label><br />
      <input
        type="text"
        name="fullname"
        placeholder="Enter your full name"
        required
      />

      <br /><br />

      <label>Email:</label><br />
      <input
        type="email"
        name="email"
        placeholder="Enter your email"
        required
      />

      <br /><br />

      <label>Phone Number:</label><br />
      <input type="tel" name="phone" placeholder="Enter your phone number" />

      <br /><br />

      <label>Years of Experience:</label><br />
      <input
        type="number"
        name="experience"
        placeholder="Enter years of experience"
      />

      <br /><br />

      <label>Upload CV Link:</label><br />
      <input type="url" name="cv" placeholder="Enter your CV link" />

      <br /><br />

      <label>Cover Letter:</label><br />
      <textarea
        name="cover_letter"
        rows="4"
        cols="40"
        placeholder="Enter your cover letter"
      ></textarea>

      <br /><br />

      <button type="submit">Apply</button>
    </form>

    <br />

    <a href="search_jobs.html">Back to Jobs</a>
  </body>
</html>
