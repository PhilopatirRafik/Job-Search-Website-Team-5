<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <title>Edit Job</title>
</head>
<body>
    <nav>
        <a href="../index.html">Home</a>
        <a href="admin_dashboard.html">Dashboard</a>
        <a href="add_job.html">Add Job</a>
        <a href="admin_jobs_list.html">Jobs List</a>
        <a href="login.html">Logout</a>
    </nav>

    <div class="admin-form-container">
        <header>
            <h1>Edit Job</h1>
        </header>

        <div class="success-message" id="successMessage">Job Updated Successfully</div>

        <form id="editJobForm">
            <div>
                <label>Job ID</label>
                <input type="text" id="jobId" readonly />
            </div>

            <div>
                <label>Job Title</label>
                <input type="text" id="jobTitle" required />
                <span class="error-message" id="titleError"></span>
            </div>

            <div>
                <label>Salary</label>
                <input type="number" id="salary" step="0.01" required />
                <span class="error-message" id="salaryError"></span>
            </div>

            <div>
                <label>Company Name</label>
                <input type="text" id="company" required />
                <span class="error-message" id="companyError"></span>
            </div>

            <div>
                <label>Job Status</label>
                <select id="status" required>
                    <option value="open">Open</option>
                    <option value="closed">Closed</option>
                </select>
            </div>

            <div>
                <label>Years of Experience</label>
                <input type="number" id="years" step="1" required />
                <span class="error-message" id="yearsError"></span>
            </div>

            <div>
                <label>Description</label>
                <textarea id="description" rows="5" required></textarea>
                <span class="error-message" id="descriptionError"></span>
            </div>

            <div class="button-group">
                <button type="submit">Update Job</button>
                <button type="button" class="btn-delete" id="deleteBtn">Delete</button>
            </div>
        </form>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const jobId = urlParams.get('id');
        let currentJob = null;

        function showError(inputId, errorId, message) {
            document.getElementById(errorId).textContent = message;
            document.getElementById(inputId).classList.add('error');
        }

        function clearErrors() {
            const errors = document.querySelectorAll('.error-message');
            errors.forEach(err => err.textContent = '');
            const inputs = document.querySelectorAll('.error');
            inputs.forEach(inp => inp.classList.remove('error'));
        }

        function loadJobData() {
            const jobs = JSON.parse(localStorage.getItem('jobs') || '[]');
            const job = jobs.find(j => j.id === jobId);
            if (job) {
                currentJob = job;
                document.getElementById('jobId').value = job.id;
                document.getElementById('jobTitle').value = job.title;
                document.getElementById('salary').value = job.salary;
                document.getElementById('company').value = job.company;
                document.getElementById('status').value = job.status;
                document.getElementById('years').value = job.years;
                document.getElementById('description').value = job.description;
            } else {
                alert('Job not found');
                window.location.href = 'admin_jobs_list.html';
            }
        }

        if (!jobId) {
            alert('No job specified for editing');
            window.location.href = 'admin_jobs_list.html';
        } else {
            loadJobData();
        }

        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('editJobForm');
            const successMsg = document.getElementById('successMessage');
            const deleteBtn = document.getElementById('deleteBtn');

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                clearErrors();

                const title = document.getElementById('jobTitle').value.trim();
                const salary = document.getElementById('salary').value;
                const company = document.getElementById('company').value.trim();
                const years = document.getElementById('years').value;
                const description = document.getElementById('description').value.trim();
                const status = document.getElementById('status').value;

                let isValid = true;

                if (title === '') {
                    showError('jobTitle', 'titleError', 'Job title is required');
                    isValid = false;
                } else if (title.length < 3) {
                    showError('jobTitle', 'titleError', 'Job title must be at least 3 characters');
                    isValid = false;
                }

                if (salary === '' || parseFloat(salary) <= 0) {
                    showError('salary', 'salaryError', 'Salary must be greater than 0');
                    isValid = false;
                }

                if (company === '') {
                    showError('company', 'companyError', 'Company name is required');
                    isValid = false;
                }

                if (years === '' || parseInt(years) < 0) {
                    showError('years', 'yearsError', 'Years of experience cannot be negative');
                    isValid = false;
                }

                if (description === '') {
                    showError('description', 'descriptionError', 'Description is required');
                    isValid = false;
                } else if (description.length < 10) {
                    showError('description', 'descriptionError', 'Description must be at least 10 characters');
                    isValid = false;
                }

                if (isValid) {
                    let jobs = JSON.parse(localStorage.getItem('jobs') || '[]');
                    const index = jobs.findIndex(j => j.id === jobId);
                    if (index !== -1) {
                        jobs[index] = {
                            ...jobs[index],
                            title: title,
                            salary: parseFloat(salary),
                            company: company,
                            status: status,
                            years: parseInt(years),
                            description: description,
                            dateUpdated: new Date().toISOString()
                        };
                        localStorage.setItem('jobs', JSON.stringify(jobs));
                        successMsg.style.display = 'block';
                        setTimeout(() => {
                            successMsg.style.display = 'none';
                            window.location.href = 'admin_jobs_list.html';
                        }, 2000);
                    }
                }
            });

            deleteBtn.addEventListener('click', function () {
                if (confirm('Are you sure you want to delete this job?')) {
                    let jobs = JSON.parse(localStorage.getItem('jobs') || '[]');
                    jobs = jobs.filter(job => job.id !== jobId);
                    localStorage.setItem('jobs', JSON.stringify(jobs));
                    alert('Job deleted successfully!');
                    window.location.href = 'admin_jobs_list.html';
                }
            });
        });
    </script>
</body>
</html>
