<html>
<head>
    <title>Edit Job</title>
</head>
<body>

    <nav>

        <a href="../index.html">Home</a>

        <a href="admin_dashboard.html">Dashboard</a>

        <a href="add_job.html">Add Job</a>

        <a href="admin_jobs_list.html">Jobs List</a>

        <a href="login.html">Logout</a>

    </nav>
    <header>
        <h1>Edit Job</h1>
    </header>
    <form>
        <div>
            <label>Job ID</label>
            <input type="text" name="job_id" value="JOB123" readonly>
        </div>
        <div>
            <label>Job Title</label>
            <input type="text"
                   name="job_title"
                   value="Frontend Developer"
                   required />
        </div>
        <div>
            <label>Salary</label>
            <input type="number"
                   name="salary"
                   step="0.01"
                   value="60000"
                   required />
        </div>
        <div>
            <label>Company Name</label>
            <input type="text"
                   name="company_name"
                   value="TechCorp"
                   required />
        </div>
        <div>
            <label>Job Status</label>
            <select name="status" required>

                <option value="open" selected>Open</option>
                <option value="closed">Closed</option>
            </select>
        </div>
        <div>
            <label>Years of Experience</label>
            <input type="number"
                   name="years_experience"
                   step="1"
                   value="3"
                   required />
        </div>
        <div>
            <label>Description</label>
            <textarea name="description" rows="5" required>We are looking for a skilled frontend developer</textarea>
        </div>

        <div>
            <button type="submit">Edit Job</button>

        </div>

    </form>
</body>

</html>
