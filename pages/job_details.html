<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <nav>
        <a href="search_jobs.html">Home</a>
        <a href="search_jobs.html">Search Jobs</a>
        <a href="user_applied_jobs.html">Applied Jobs</a>
        <a href="../index.html" onclick="localStorage.removeItem('currentUser')">Logout</a>
    </nav>
    <div class="job-container" id="detailsContainer">
        </div>

    <script>
    document.addEventListener("DOMContentLoaded", function() {
        const urlParams = new URLSearchParams(window.location.search);
        const jobId = urlParams.get('id');
        const jobs = JSON.parse(localStorage.getItem("jobs")) || [];
        const applications = JSON.parse(localStorage.getItem("applications")) || [];
        const job = jobs.find(j => j.id == jobId);

        const container = document.getElementById("detailsContainer");
        if (job) {
            const isApplied = applications.some(app => app.jobId === job.id);
            container.innerHTML = `
                <h1>Job Details: ${job.title}</h1>
                <div class="dashboard-container">
                    <p><strong>Company:</strong> ${job.company}</p>
                    <p><strong>Experience:</strong> ${job.years} Years</p>
                    <p><strong>Salary:</strong> $${job.salary}</p>
                    <p><strong>Status:</strong> ${job.status}</p>
                    <p><strong>Description:</strong> ${job.description}</p>
                    <br>
                    <div id="actionArea"></div> <br>
                    <a href="job_results.html">Back to results</a>
                </div>`;

            const actionArea = document.getElementById("actionArea");

            if (job.status === "closed") {
                actionArea.innerHTML = `<p style="color:red; font-weight:bold; border: 1px solid red; padding: 10px;">This job is CLOSED.</p>`;
            } else if (isApplied) {
                actionArea.innerHTML = `<button class="button" disabled style="background-color:gray; cursor: not-allowed;">Already Applied</button>`;
            } else {
                actionArea.innerHTML = `<button class="button" id="applyBtn">Apply for Job</button>`;
                
                document.getElementById("applyBtn").addEventListener("click", function() {
                    window.location.href = `apply_job.html?id=${job.id}`;
                });
            }
        } else {
            container.innerHTML = "<h2>Job not found!</h2>";
        }
    });
    </script>
</body>
</html>
