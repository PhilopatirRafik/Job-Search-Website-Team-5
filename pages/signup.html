<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lobster+Two:ital,wght@0,400;0,700;1,400;1,700&family=Playwrite+NZ+Basic:wght@200&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../login.css" />

  </head>
  <body>
    <nav>
      <a href="login.html">Login</a>
    </nav>
    <form class="form">
      <div class="container">
      <h2 class="form-title">Sign Up</h2><br />
    

        <!-- Add form fields for username, email, phone number, password, confirm
        password--> 
        <label for="username">Username</label><br />
        <input type="text" id="username" required /><br />
        <label for="email">Email</label><br />
        <input type="email" id="email" required /><br />
        <label for="password">Password</label><br />
        <input type="password" id="password" required /><br />
        <label for="confirm-password">Confirm Password</label><br />
        <input type="password" id="confirm-password" required /><br />

        <!-- Add form fields for gender, country, and user type (job seeker or
        employer) --> <!--gender -->
        <label for="gender">Gender</label><br />
      <div class="options">
        <input type="radio" id="male" name="gender" value="Male" />
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="Female" />
        <label for="female">Female</label><br /><br />
      </div>

        <!--user type -->
        <label for="user-type">I am a:</label>
        <div class="options">
        <input
          type="radio"
          id="job-seeker"
          name="user-type"
          value="Job Seeker"
        />
        <label for="job-seeker">Job Seeker</label>
        <input type="radio" id="employer" name="user-type" value="Employer" />
        <label for="employer">Employer</label><br /><br />
      </div>

        <input type="submit" value="Sign Up" />
        <p>Already have an account? <a href="login.html">Login</a></p>
      </div>
      </form>
  </body>
</html>
