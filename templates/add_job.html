{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>Add New Job</title>
</head>
<body>
    <nav>
        <a href="{% url 'admin_dashboard' %}">Home</a>
        <a href="{% url 'admin_dashboard' %}">Dashboard</a>
        <a href="{% url 'add_job' %}">Add Job</a>
        <a href="{% url 'admin_jobs_list' %}">Jobs List</a>
        <a href="{% url 'login' %}">Logout</a>
    </nav>

    <div class="admin-form-container">
        <h1>Add New Job</h1>

        {% if errors %}
        <div class="error-messages" style="background: #fee2e2; padding: 10px; border-radius: 10px; margin-bottom: 20px;">
            {% for key, error in errors.items %}
            <p style="color: #c2410c; margin: 5px 0;">{{ error }}</p>
            {% endfor %}
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div>
                <label for="title">Job Title</label>
                <input type="text" id="title" name="title" value="{{ form_data.title }}" required>
            </div>

            <div>
                <label for="salary">Salary</label>
                <input type="number" id="salary" name="salary" step="0.01" value="{{ form_data.salary }}" required>
            </div>

            <div>
                <label for="company">Company Name</label>
                <input type="text" id="company" name="company" value="{{ form_data.company }}" required>
            </div>

            <div>
                <label for="status">Job Status</label>
                <select id="status" name="status" required>
                    <option value="open" {% if form_data.status == 'open' %}selected{% endif %}>Open</option>
                    <option value="closed" {% if form_data.status == 'closed' %}selected{% endif %}>Closed</option>
                </select>
            </div>

            <div>
                <label for="years">Years of Experience</label>
                <input type="number" id="years" name="years" step="1" min="0" value="{{ form_data.years }}" required>
            </div>

            <div>
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="5" required>{{ form_data.description }}</textarea>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-primary">Add Job</button>
                <button type="reset" class="btn-reset">Reset</button>
            </div>
        </form>
    </div>
</body>
</html>
