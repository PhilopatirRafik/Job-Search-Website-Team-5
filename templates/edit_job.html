{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>Edit Job</title>
</head>
<body>
    <nav>
        <a href="{% url 'admin_dashboard' %}">Home</a>
        <a href="{% url 'admin_dashboard' %}">Dashboard</a>
        <a href="{% url 'add_job' %}">Add Job</a>
        <a href="{% url 'admin_jobs_list' %}">Jobs List</a>
        <a href="{% url 'login' %}">Logout</a>
    </nav>

    <div class="admin-form-container">
        <h1>Edit Job</h1>

        {% if errors %}
        <div class="error-messages" style="background: #fee2e2; padding: 10px; border-radius: 10px; margin-bottom: 20px;">
            {% for key, error in errors.items %}
            <p style="color: #c2410c; margin: 5px 0;">{{ error }}</p>
            {% endfor %}
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div>
                <label>Job ID</label>
                <input type="text" name="job_id" value="{{ job.id }}" readonly>
            </div>

            <div>
                <label>Job Title</label>
                <input type="text" name="title" value="{{ job.title }}" required>
            </div>

            <div>
                <label>Salary</label>
                <input type="number" name="salary" value="{{ job.salary }}" step="0.01" required>
            </div>

            <div>
                <label>Company Name</label>
                <input type="text" name="company" value="{{ job.company }}" required>
            </div>

            <div>
                <label>Job Status</label>
                <select name="status" required>
                    <option value="open" {% if job.status == 'open' %}selected{% endif %}>Open</option>
                    <option value="closed" {% if job.status == 'closed' %}selected{% endif %}>Closed</option>
                </select>
            </div>

            <div>
                <label>Years of Experience</label>
                <input type="number" name="years" value="{{ job.years }}" step="1" required>
            </div>

            <div>
                <label>Description</label>
                <textarea name="description" rows="5" required>{{ job.description }}</textarea>
            </div>

            <div class="button-group">
                <button type="submit">Save Changes</button>
                <a href="{% url 'admin_jobs_list' %}" class="btn-reset">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
