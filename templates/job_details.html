{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Details</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <nav>
        <a href="{% url 'search_jobs' %}">Home</a>
        <a href="{% url 'search_jobs' %}">Search Jobs</a>
        <a href="{% url 'user_applied_jobs' %}">Applied Jobs</a>
        <a href="{% url 'login' %}" onclick="localStorage.removeItem('currentUser')">Logout</a>
    </nav>

    <div class="job-details-container" id="detailsContainer">
        Loading...
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async function () {
            const urlParams = new URLSearchParams(window.location.search);
            const jobId = urlParams.get("id");
            const container = document.getElementById("detailsContainer");

            if (!jobId) {
                container.innerHTML = '<p style="color:red;">No job specified.</p>';
                return;
            }

            try {
                const response = await fetch(`/api/jobs/details/${jobId}/`);
                if (!response.ok) throw new Error("Job not found");
                const job = await response.json();

                container.innerHTML = `
                        <div class="job-card">
                            <h2>${job.title}</h2>
                            <p><strong>Company:</strong> ${job.company}</p>
                            <p><strong>Experience:</strong> ${job.years} years</p>
                            <p><strong>Salary:</strong> $${job.salary}</p>
                            <p><strong>Status:</strong> ${job.status}</p>
                            <p><strong>Description:</strong> ${job.description}</p>
                            <button id="applyBtn" class="apply-btn">Apply Now</button>
                        </div>
                    `;

                document.getElementById("applyBtn").addEventListener("click", function () {
                    window.location.href = `/apply/?id=${job.id}`;
                });

            } catch (error) {
                container.innerHTML = '<p style="color:red;">Error loading job details.</p>';
            }
        });
    </script>
</body>
</html>
