{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <nav>
        <a href="{% url 'search_jobs' %}">Home</a>
        <a href="{% url 'search_jobs' %}">Search Jobs</a>
        <a href="{% url 'user_applied_jobs' %}">Applied Jobs</a>
        <a href="{% url 'login' %}" onclick="localStorage.removeItem('currentUser')">Logout</a>
    </nav>
    <div class="job-container" id="detailsContainer">
        </div>

    <script>
    document.addEventListener("DOMContentLoaded", async function() {
    const tableBody = document.getElementById("jobsList");

    const urlParams = new URLSearchParams(window.location.search);
    const title = urlParams.get("title") || "";
    const exp = urlParams.get("exp") || "";

    try {
        const response = await fetch(`/api/jobs/search/?title=${encodeURIComponent(title)}&exp=${encodeURIComponent(exp)}`);
        const jobs = await response.json();

        if (jobs.length === 0) {
            tableBody.innerHTML = "<tr><td colspan='6'>No jobs found.</td></tr>";
            return;
        }

        jobs.forEach(job => {
            let row = `
                <tr>
                    <td>${job.title}</td>
                    <td>${job.company}</td>
                    <td>${job.years} Years</td>
                    <td>$${job.salary}</td>
                    <td>${job.status}</td>
                    <td>
                        <a href="/details/?id=${job.id}" class="button">View</a>
                    </td>
                </tr>
            `;
            tableBody.innerHTML += row;
        });

    } catch (error) {
        tableBody.innerHTML = "<tr><td colspan='6'>Error loading jobs.</td></tr>";
    }
});

    </script>
</body>
</html>
