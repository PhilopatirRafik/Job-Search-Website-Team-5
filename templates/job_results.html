{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Results</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <nav>
      <a href="{% url 'search_jobs' %}">Home</a>
      <a href="{% url 'search_jobs' %}">Search Jobs</a>
      <a href="{% url 'user_applied_jobs' %}">Applied Jobs</a>
      <a href="{% url 'login' %}" onclick="localStorage.removeItem('currentUser')">Logout</a>
    </nav>
    <header>
      <h1>Available Jobs</h1>
    </header>
    <section class="job-container">
      <table border="1" id="resultsTable">
        <thead>
            <tr>
              <th>Job Title</th>
              <th>Company Name</th>
              <th>Experience</th>
              <th>Salary</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
        </thead>
        <tbody id="jobsList">
            </tbody>
      </table>
    </section>

    <script>
    document.addEventListener("DOMContentLoaded", async function() {
    const tableBody = document.getElementById("jobsList");

    const urlParams = new URLSearchParams(window.location.search);
    const title = urlParams.get("title") || "";
    const exp = urlParams.get("exp") || "";

    try {
        const response = await fetch(`/api/jobs/search/?title=${encodeURIComponent(title)}&exp=${encodeURIComponent(exp)}`);
        const jobs = await response.json();

        if (jobs.length === 0) {
            tableBody.innerHTML = "<tr><td colspan='6'>No jobs found.</td></tr>";
            return;
        }

        jobs.forEach(job => {
            let row = `
                <tr>
                    <td>${job.title}</td>
                    <td>${job.company}</td>
                    <td>${job.years} Years</td>
                    <td>$${job.salary}</td>
                    <td>${job.status}</td>
                    <td>
                        <a href="/details/?id=${job.id}" class="button">View</a>
                    </td>
                </tr>
            `;
            tableBody.innerHTML += row;
        });

    } catch (error) {
        tableBody.innerHTML = "<tr><td colspan='6'>Error loading jobs.</td></tr>";
    }
});

  </script>
</body>
</html>
